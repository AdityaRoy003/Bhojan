<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bhojanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#FF5200" />
      <stop offset="100%" stop-color="#E02600" />
    </linearGradient>

    <!-- Bowl & Metal Shine Gradient -->
    <linearGradient id="bowlShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFF2E8" />
      <stop offset="100%" stop-color="#FFD6C2" />
    </linearGradient>

    <!-- Golden Steam Accent -->
    <linearGradient id="steamGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFE885" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFA800" stop-opacity="0.1" />
    </linearGradient>

    <!-- Food / Curry Glow Gradient -->
    <linearGradient id="foodGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="50%" stop-color="#FFB703" />
      <stop offset="100%" stop-color="#FB8500" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#7A1200" flood-opacity="0.45" />
    </filter>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bhojanBg)" filter="url(#softGlow)" />

  <!-- Inner Soft Ring / Rim Light -->
  <rect x="28" y="28" width="456" height="456" rx="124" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6" />

  <!-- Rising Aromatic Steam Waves -->
  <g filter="url(#iconGlow)">
    <!-- Center Steam -->
    <path d="M256 120 C240 148, 272 170, 256 198" fill="none" stroke="url(#steamGlow)" stroke-width="16" stroke-linecap="round" />
    <!-- Left Steam -->
    <path d="M206 138 C192 162, 220 178, 208 202" fill="none" stroke="url(#steamGlow)" stroke-width="13" stroke-linecap="round" />
    <!-- Right Steam -->
    <path d="M306 138 C320 162, 292 178, 304 202" fill="none" stroke="url(#steamGlow)" stroke-width="13" stroke-linecap="round" />
  </g>

  <!-- Chef Cloche / Food Bowl Structure -->
  <g filter="url(#iconGlow)">
    <!-- Steaming Food Mound inside Bowl -->
    <path d="M142 260 C142 220, 370 220, 370 260 Z" fill="url(#foodGlow)" />

    <!-- Garnishing Fresh Herb / Mint Leaf -->
    <path d="M256 220 C244 200, 260 184, 276 192 C284 208, 268 220, 256 220 Z" fill="#2EC4B6" />
    <path d="M256 220 C244 208, 234 212, 232 222 C242 228, 252 224, 256 220 Z" fill="#20BF55" />

    <!-- Main Curved Bowl Body -->
    <path d="M120 252 C120 350, 180 376, 256 376 C332 376, 392 350, 392 252 C392 248, 386 244, 380 244 L132 244 C126 244, 120 248, 120 252 Z" fill="url(#bowlShine)" />

    <!-- Bowl Rim Highlight -->
    <ellipse cx="256" cy="252" rx="136" ry="16" fill="#FFFFFF" />
    <ellipse cx="256" cy="254" rx="126" ry="11" fill="url(#foodGlow)" opacity="0.35" />

    <!-- Sleek Pedestal / Bowl Base Stand -->
    <path d="M200 372 L188 396 C186 400, 190 404, 196 404 L316 404 C322 404, 326 400, 324 396 L312 372 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- Subtle Smile / Bhojan Swirl across Bowl -->
    <path d="M184 290 Q256 340 328 290" fill="none" stroke="#FF5200" stroke-width="12" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Sparkle Stars for Fresh & Delicious Quality -->
  <path d="M380 150 Q380 166 396 166 Q380 166 380 182 Q380 166 364 166 Q380 166 380 150 Z" fill="#FFF275" opacity="0.95" />
  <circle cx="136" cy="184" r="7" fill="#FFF275" opacity="0.85" />
</svg>
